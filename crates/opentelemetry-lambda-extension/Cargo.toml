[package]
name = "opentelemetry-lambda-extension"
version = "0.1.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors = ["Daniel Verrall"]
description = "AWS Lambda extension for collecting and exporting OpenTelemetry signals"
repository = "https://github.com/djvcom/lambda-observability"
documentation = "https://docs.rs/opentelemetry-lambda-extension"
readme = "README.md"
keywords = ["lambda", "aws", "opentelemetry", "telemetry", "extension"]
categories = ["development-tools::profiling"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
bench = false

[[bin]]
name = "opentelemetry-lambda-extension"
path = "src/main.rs"
bench = false

[lints]
workspace = true

[dependencies]
reqwest = { workspace = true, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tokio-util = { version = "0.7", features = ["rt"] }
figment = { version = "0.10.19", features = ["env", "toml"] }
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-proto.workspace = true
axum = { workspace = true, features = ["tokio"] }
tower = { version = "0.5.3", features = ["timeout"] }
bytes = "1.11.1"
prost = "0.14.4"
chrono = { workspace = true, features = ["serde"] }
flate2 = "1.1.9"
hex = "0.4.3"
lambda-extension = "1.0.4"
tracing-subscriber = { workspace = true, features = ["env-filter"] }
opentelemetry-semantic-conventions = { version = "0.32", features = ["semconv_experimental"] }
rand = "0.10.1"

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
lambda-simulator.workspace = true
opentelemetry-lambda-example.workspace = true
lambda_runtime.workspace = true
mock-collector = "0.2.12"
temp-env.workspace = true
tempfile = "3.27.0"
serial_test = "3.5.0"
criterion = "0.8.2"
proptest = "1.11.0"

[[bench]]
name = "conversion"
harness = false

[[bench]]
name = "aggregator"
harness = false

[[bench]]
name = "export_encode"
harness = false
